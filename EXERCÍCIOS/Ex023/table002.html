<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uso de Tabelas Grandes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Uso de Tabelas Grandes</h1>
    <table>
        <thead>
                <th>Unidade Federativa</th>
                <th>População</th>
        </thead>
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="number">46 179 008</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="number">21 460 311</td>
            </tr>
        </tbody>
        <tfoot>
            <th>
                TOTAL
            </th>
            <td class="number">64 587 554</td>
        </tfoot>
    </table>
    
</body>
</html>
