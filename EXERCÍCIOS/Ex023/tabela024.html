<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Tabela maior</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table>
        <caption>Minha nova tabela</caption>
        <thead>
            <colgroup>
                <col id="grupo">
                <col id="nomes">
                <col id="filmes">
            </colgroup>
            <tr>
                <th>Grupo</th>
                <th>Nomes</th>
                <th colspan="3">filmes</th>
            </tr>
            <tr>
                <th rowspan="3" scope="row">Mulheres</th>
                <td class="nome">Ana Maria Santos</td>
                <td>Alien</td>
                <td>Rambo</td>
                <td>Vingadores</td>
            </tr>
            <tr>
                <td class="nome">Beatriz Souza</td>
                <td>Hulk</td>
                <td>Inception</td>
                <td>Batman</td>
            </tr>
            <tr>
                <td class="nome">Cláudio Melo</td>
                <td>Oblivion</td>
                <td>Matrix</td>
                <td>Big Hero</td>
            </tr>
            <tr>
                <th rowspan="3" scope="row">Homens</th>
                <td class="nome">Bruno Mendonça</td>
                <td>Intocáveis</td>
                <td>Amnésia</td>
                <td>Gladiado</td>
            </tr>
            <tr>
                <td class="nome">Daniel Lourenço</td>
                <td>Wall-E</td>
                <td>Oldboy</td>
                <td>Dangal</td>
            </tr>
            <tr>
                <td class="nome">Fabiano Mota</td>
                <td>Star Was</td>
                <td>Taxi Driver</td>
                <td>Toy Story</td>
            </tr>

        </thead>
    </table>
</body>
</html>
